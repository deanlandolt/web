<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="sans-serif">
  <style>
    .num { fill: var(--vp-c-text-1, #333); font-size: 20px; font-weight: bold; }
    .op { fill: var(--vp-c-brand-1, #3451b2); font-size: 22px; font-weight: bold; }
    .label { fill: var(--vp-c-text-2, #888); font-size: 13px; }
    .eq { fill: var(--vp-c-text-2, #888); font-size: 16px; }
    .triangle { fill: none; stroke: var(--vp-c-text-2, #888); stroke-width: 1.5; }
    .question { fill: var(--vp-c-brand-1, #3451b2); font-size: 14px; font-style: italic; }
  </style>

  <!-- Left triangle: "addition" reading -->
  <text x="130" y="30" class="label" text-anchor="middle">Reading 1: addition</text>
  <polygon points="130,60 80,150 180,150" class="triangle"/>
  <text x="130" y="55" class="num" text-anchor="middle">7</text>
  <text x="80" y="170" class="num" text-anchor="middle">3</text>
  <text x="180" y="170" class="num" text-anchor="middle">4</text>
  <text x="130" y="195" class="eq" text-anchor="middle">3 + 4 = 7</text>

  <!-- Right triangle: "subtraction" reading — same drawing -->
  <text x="390" y="30" class="label" text-anchor="middle">Reading 2: subtraction</text>
  <polygon points="390,60 340,150 440,150" class="triangle"/>
  <text x="390" y="55" class="num" text-anchor="middle">7</text>
  <text x="340" y="170" class="num" text-anchor="middle">3</text>
  <text x="440" y="170" class="num" text-anchor="middle">4</text>
  <text x="390" y="195" class="eq" text-anchor="middle">7 − 4 = 3</text>

  <!-- The question -->
  <text x="260" y="120" class="question" text-anchor="middle">Same drawing.</text>
  <text x="260" y="140" class="question" text-anchor="middle">Which is it?</text>
</svg>